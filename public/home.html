<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087f5b">
  <title>JAMALI | Home</title>

  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      color: #17392d;
      background: #f3f8f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 20px 6%;
      background: #087f5b;
      color: white;
    }

    .brand {
      margin: 0;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 2px;
    }

main {
      flex: 1;
      width: min(100%, 1000px);
      margin: 0 auto;
      padding: 42px 22px;
    }

    .welcome {
      margin-bottom: 30px;
    }

    .welcome h1 {
      margin: 0 0 12px;
      font-size: clamp(29px, 5vw, 42px);
      letter-spacing: -1px;
    }

    .welcome p {
      margin: 0;
      color: #65766c;
      line-height: 1.7;
    }

    .account {
      margin-top: 12px !important;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    .section-title {
      margin: 32px 0 17px;
      font-size: 20px;
    }

    .business-button,
    .business-square-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 120px;
      height: 120px;
      min-width: 120px;
      min-height: 120px;
      max-width: 120px;
      max-height: 120px;
      flex: 0 0 120px;
      box-sizing: border-box;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      background: #16a34a;
      color: #fff;
      text-align: center;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }

    .business-button:hover,
    .business-square-button:hover {
      background: #15803d;
      transform: translateY(-2px);
    }

    .business-title {
      display: block;
      margin: 0;
      font-size: 17px;
      line-height: 1.3;
      font-weight: 800;
    }

    .business-button:focus-visible,
    .business-square-button:focus-visible {
      outline: 3px solid #86efac;
      outline-offset: 3px;
    }

    .business-description,
    .arrow {
      display: none;
    }

    .status {
      min-height: 24px;
      margin-top: 18px;
      color: #65766c;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    footer {
      padding: 20px;
      text-align: center;
      color: #75847b;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <header>
    <p class="brand">JAMALI</p>
    
  </header>

  <main>
    <section class="welcome">
      <h1>Welcome to JAMALI</h1>
      <p>Multisystem Management</p>
      <p id="account-email" class="account" hidden></p>
    </section>

    <h2 class="section-title">Your systems</h2>

    <button id="business-button"
            class="business-button business-square-button"
            type="button">
      <span class="business-title">Business</span>
    </button>

    <div id="home-status"
         class="status"
         role="status"
         aria-live="polite"></div>
  </main>

  <footer>
    &copy; <span id="year"></span> JAMALI Multisystem Management
  </footer>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>

  <script type="module">
    import { auth } from "./firebase.js";

    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    const email = document.getElementById("account-email");
    const status = document.getElementById("home-status");
    const businessButton = document.getElementById("business-button");

    let authenticated = false;

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        authenticated = false;
        window.location.replace("./index.html");
        return;
      }

      authenticated = true;
      email.textContent = user.email || "Google account signed in";
      email.hidden = false;
    });

    businessButton.addEventListener("click", () => {
      if (!authenticated) {
        window.location.replace("./index.html");
        return;
      }

      status.textContent =
        "The Business button is ready. The Business page has not been created yet.";
    });
  </script>
</body>
</html>
