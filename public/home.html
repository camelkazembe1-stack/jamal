<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JMS Multsystem Management — Home</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; box-sizing: border-box; background: #f3f6fb;
      font-family: Arial, sans-serif; color: #172033;
    }
    main {
      width: 100%; max-width: 500px; box-sizing: border-box;
      padding: 36px 28px; border-radius: 18px; background: white;
      text-align: center; box-shadow: 0 12px 40px #17203318;
    }
    #status { overflow-wrap: anywhere; }
    button {
      padding: 12px 22px; border: 0; border-radius: 9px;
      background: #1769e0; color: white; font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="heading">Checking your login…</h1>
    <p id="details" role="status" aria-live="polite">Verifying your Firebase session.</p>
    <button id="logout" hidden>Sign out</button>
  </main>

  <script type="module">
    import { auth, authReady } from "./firebase.js";
    import {
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

    const heading = document.getElementById("heading");
    const details = document.getElementById("details");
    const logout = document.getElementById("logout");

    try {
      await authReady;
      await auth.authStateReady();

      const user = auth.currentUser;

      if (!user) {
        heading.textContent = "Login session not found";
        details.textContent =
          "No active Google login was found in this browser. Please sign in again.";
        const link = document.createElement("a");
        link.href = "./index.html";
        link.textContent = "Return to login";
        details.appendChild(document.createElement("br"));
        details.appendChild(link);
      } else {
        heading.textContent = "You are successfully logged in!";
        details.textContent = "Welcome, " + (user.displayName || user.email || "user") +
          ". Your Google account is authenticated.";
        logout.hidden = false;
      }
    } catch (error) {
      heading.textContent = "Unable to verify login";
      details.textContent = error.code
        ? error.code + ": " + error.message
        : error.message;
      console.error("Home authentication check:", error);
    }

    logout.addEventListener("click", async () => {
      logout.disabled = true;
      try {
        await signOut(auth);
        window.location.replace("./index.html");
      } catch (error) {
        details.textContent = "Sign-out failed: " + error.message;
        logout.disabled = false;
      }
    });
  </script>
</body>
</html>
