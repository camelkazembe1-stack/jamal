<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Metadata Editor — JAMALI Convertor</title>
<link rel="stylesheet" href="/document-metadata-editor/299.css">

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>Document Metadata Editor</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🗂️ Document and Office Utilities</span>
    <span class="t-chip">Tool #235 of 256</span>
    <span class="t-chip">/document-metadata-editor/299</span>
  </div>
<div class="t-panel">
  <div class="t-drop" id="drop">Drop the file here or click to choose<small id="drop-hint">Word document (.docx)</small></div>
  <input type="file" id="file" accept=".docx" hidden>
  <div class="t-row"><button class="t-btn" id="run">Run</button></div>
  <p class="t-msg" id="t-msg"></p>
  <ul class="t-files" id="files"></ul>
</div><div class="t-panel">
  <div class="t-grid2">
    <div><label class="t-lab" for="ti">Title</label><input class="t-in" id="ti"></div>
    <div><label class="t-lab" for="au">Author (creator)</label><input class="t-in" id="au"></div>
    <div><label class="t-lab" for="su">Subject</label><input class="t-in" id="su"></div>
    <div><label class="t-lab" for="kw">Keywords</label><input class="t-in" id="kw"></div>
  </div>
  <div class="t-row"><button class="t-btn" id="run">Save metadata</button></div>
  <p class="t-msg" id="t-msg"></p>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/document-metadata-editor/299.js" defer></script>
</body>
</html>
