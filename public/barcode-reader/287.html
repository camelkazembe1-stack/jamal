<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barcode Reader — JAMALI Convertor</title>
<link rel="stylesheet" href="/barcode-reader/287.css">

<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>Barcode Reader</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🧰 File Utilities</span>
    <span class="t-chip">Tool #223 of 256</span>
    <span class="t-chip">/barcode-reader/287</span>
  </div>
<div class="t-panel">
  <div class="t-drop" id="drop">Drop the file here or click to choose<small id="drop-hint">Image containing a barcode</small></div>
  <input type="file" id="file" accept="image/*" hidden>
  <div class="t-row"><button class="t-btn" id="run">Run</button></div>
  <p class="t-msg" id="t-msg"></p>
  <ul class="t-files" id="files"></ul>
</div><div class="t-panel">
  <img class="t-prev" id="prev" alt="" hidden>
  <div class="t-row"><button class="t-btn" id="run">Read barcode</button></div>
  <label class="t-lab" for="out">Decoded content</label>
  <textarea class="t-out" id="out" readonly placeholder="Barcode content appears here…"></textarea>
  <p class="t-msg" id="t-msg"></p>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/barcode-reader/287.js" defer></script>
</body>
</html>
