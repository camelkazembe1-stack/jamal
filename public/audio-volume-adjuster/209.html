<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Volume Adjuster — JAMALI Convertor</title>
<link rel="stylesheet" href="/audio-volume-adjuster/209.css">

<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>Audio Volume Adjuster</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🎵 Audio Tools</span>
    <span class="t-chip">Tool #145 of 256</span>
    <span class="t-chip">/audio-volume-adjuster/209</span>
  </div>
<div class="t-panel">
  <div class="t-drop" id="drop">Drop the file here or click to choose<small id="drop-hint">Audio file</small></div>
  <input type="file" id="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg" hidden>
  <div class="t-row"><button class="t-btn" id="run">Run</button></div>
  <p class="t-msg" id="t-msg"></p>
  <ul class="t-files" id="files"></ul>
</div><div class="t-panel">
  <div class="t-grid3">
    <div><label class="t-lab" for="vol">Volume (%)</label><input class="t-in" id="vol" type="number" value="150" min="1" max="500"></div>
    <div><label class="t-lab" for="norm">Normalize peaks</label><select class="t-sel" id="norm"><option value="0">No</option><option value="1">Yes (max = 98%)</option></select></div>
    <div><label class="t-lab" for="fmt">Output</label><select class="t-sel" id="fmt"><option value="wav">WAV</option><option value="mp3">MP3 (128k)</option></select></div>
  </div>
  <div class="t-row"><button class="t-btn" id="run">Apply</button></div>
  <p class="t-msg" id="t-msg"></p>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/audio-volume-adjuster/209.js" defer></script>
</body>
</html>
