<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPTX to Video — JAMALI Convertor</title>
<link rel="stylesheet" href="/pptx-to-video/157.css">

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>PPTX to Video</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">📽️ Presentation Tools</span>
    <span class="t-chip">Tool #93 of 256</span>
    <span class="t-chip">/pptx-to-video/157</span>
  </div>
<div class="t-panel">
  <div class="t-drop" id="drop">Drop the file here or click to choose<small id="drop-hint">PowerPoint (.pptx)</small></div>

  <div class="t-row"><button class="t-btn" id="run">Run</button><div class="t-grow"><label class="t-lab" for="secs">Seconds per slide</label><input class="t-in" id="secs" type="number" value="3" min="1" max="15"></div></div>

  <ul class="t-files" id="files"></ul>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
