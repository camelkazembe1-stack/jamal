<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XLS to XLSX — JAMALI Convertor</title>
<link rel="stylesheet" href="/xls-to-xlsx/135.css">

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>XLS to XLSX</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">📊 Spreadsheet and Data Tools</span>
    <span class="t-chip">Tool #71 of 256</span>
    <span class="t-chip">/xls-to-xlsx/135</span>
  </div>
<div class="t-panel">
  <div class="t-drop" id="drop">Drop the file here or click to choose<small id="drop-hint">Excel 97-2003 (.xls)</small></div>
  <input type="file" id="file" accept=".xls,application/vnd.ms-excel" hidden>
  <div class="t-row"><button class="t-btn" id="run">Run</button></div>
  <p class="t-msg" id="t-msg"></p>
  <ul class="t-files" id="files"></ul>
</div><div class="t-panel"><label class="t-lab" for="out">Result preview</label>
  <textarea class="t-out" id="out" readonly placeholder="Result appears here…"></textarea>
  <p class="t-msg" id="t-msg"></p>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/xls-to-xlsx/135.js" defer></script>

</html>
