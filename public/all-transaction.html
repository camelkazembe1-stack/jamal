<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Transaction | JAMALI</title>
  <link rel="stylesheet" href="/all-transaction.css">
  <script type="module" src="/all-transaction.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="back" href="/">JAMALI</a>
    <h1>All Transaction</h1>
  </header>
  <main>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search transactions..." aria-label="Search transactions">
      <button id="refresh" type="button">Refresh</button>
    </div>
    <p id="status" role="status">Loading transactions...</p>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Date</th><th>Transaction</th><th>Flow</th><th>Method</th>
          <th>Name</th><th>Amount</th><th>Charges</th><th>Transfer</th><th>Document ID</th>
        </tr></thead>
        <tbody id="transactions"></tbody>
      </table>
    </div>
  </main>
</body>
</html>
