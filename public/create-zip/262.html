<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create ZIP — JAMALI Convertor</title>
<link rel="stylesheet" href="/create-zip/262.css">

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>Create ZIP</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🗜️ Archive and Compression Tools</span>
    <span class="t-chip">Tool #198 of 256</span>

  </div>
<div class="t-panel">

  <div class="t-row"><button class="t-btn" id="run">Run</button></div>

</div><div class="t-panel">

  <p class="t-msg" id="t-msg"></p>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/create-zip/262.js" defer></script>
