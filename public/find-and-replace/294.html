<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find and Replace — JAMALI Convertor</title>
<link rel="stylesheet" href="/find-and-replace/294.css">

<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>Find and Replace</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🗂️ Document and Office Utilities</span>
    <span class="t-chip">Tool #230 of 256</span>
    <span class="t-chip">/find-and-replace/294</span>
  </div>
<div class="t-panel"><label class="t-lab" for="in">Input</label><textarea class="t-in" id="in" placeholder="Paste or type here…"></textarea><div class="t-row"><button class="t-btn" id="run">Replace all</button></div><div class="t-row t-grow"><label class="t-lab" for="find">Find</label><input class="t-in" id="find" placeholder="text or /regex/"></div><div class="t-row t-grow"><label class="t-lab" for="rep">Replace with</label><input class="t-in" id="rep" placeholder="replacement ($1 works in regex)"></div><div class="t-row"><label><input type="checkbox" id="re" checked> Regular expression</label><label><input type="checkbox" id="ci"> Ignore case</label></div><p class="t-msg" id="t-msg"></p><label class="t-lab" for="out">Output</label><textarea class="t-out" id="out" readonly placeholder="Result appears here…"></textarea><div class="t-row"><button class="t-btn ghost" id="copy">Copy result</button><button class="t-btn ghost" id="dl-txt">Download .txt</button></div></div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/find-and-replace/294.js" defer></script>
</body>
</html>
