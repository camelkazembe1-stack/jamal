<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Add Transaction | JAMALI</title>
  <link rel="stylesheet" href="3.css">
  <script type="module" src="3.js"></script>
</head>
<body>
  <main class="page">
    <header>
      <h1>Add Transaction</h1>
      <p>Select a transaction, complete its fields, and save.</p>
    </header>

    <section id="transaction-groups" aria-label="Transaction types">
      <div class="group">
        <h2>IN</h2>
        <div class="buttons">
          <button type="button" class="transaction-button" data-transaction="Sales">Sales</button>
          <button type="button" class="transaction-button" data-transaction="Commission Received">Commission Received</button>
        </div>
      </div>
      <div class="group">
        <h2>OUT</h2>
        <div class="buttons">
          <button type="button" class="transaction-button" data-transaction="Purchases">Purchases</button>
          <button type="button" class="transaction-button" data-transaction="Rent">Rent</button>
        </div>
      </div>
      <div class="group">
        <h2>NEUTRAL</h2>
        <div class="buttons">
          <button type="button" class="transaction-button" data-transaction="Retained Profit">Retained Profit</button>
        </div>
      </div>
      <div class="group">
        <h2>CONTRA</h2>
        <div class="buttons">
          <button type="button" class="transaction-button" data-transaction="Withdraw Cash">Withdraw Cash</button>
          <button type="button" class="transaction-button" data-transaction="Deposit Cash">Deposit Cash</button>
        </div>
      </div>
    </section>

    <section id="entry-panel" class="entry-panel" hidden>
      <h2 id="form-title">Transaction</h2>
      <form id="transaction-form">
        <div id="dynamic-fields" class="fields"></div>
        <div class="actions">
          <button id="save-button" type="submit">Save Transaction</button>
          <button id="cancel-button" type="button" class="secondary">Cancel</button>
        </div>
      </form>
      <p id="form-status" role="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
