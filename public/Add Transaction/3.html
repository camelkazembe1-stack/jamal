<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Transaction | JAMALI</title>
  <link rel="stylesheet" href="3.css">
  <script type="module" src="3.js"></script>
</head>
<body>
  <main class="container">
    <header class="page-header">
      <h1>Add Transaction</h1>
      <p>Select a transaction below to enter its details.</p>
    </header>

    <section class="groups" aria-label="Transaction groups">
      <article class="group">
        <h2>IN</h2>
        <div class="transaction-buttons">
          <button type="button" data-transaction="Sales">Sales</button>
          <button type="button" data-transaction="Commission Received">Commission Received</button>
        </div>
      </article>

      <article class="group">
        <h2>OUT</h2>
        <div class="transaction-buttons">
          <button type="button" data-transaction="Purchases">Purchases</button>
          <button type="button" data-transaction="Rent">Rent</button>
        </div>
      </article>

      <article class="group">
        <h2>NEUTRAL</h2>
        <div class="transaction-buttons">
          <button type="button" data-transaction="Retained Profit">Retained Profit</button>
        </div>
      </article>

      <article class="group">
        <h2>CONTRA</h2>
        <div class="transaction-buttons">
          <button type="button" data-transaction="Withdraw Cash">Withdraw Cash</button>
          <button type="button" data-transaction="Deposit Cash">Deposit Cash</button>
        </div>
      </article>
    </section>

    <section id="entry-panel" class="entry-panel" hidden>
      <h2 id="form-title">Transaction Details</h2>
      <form id="transaction-form">
        <div id="fields" class="fields"></div>
        <div class="form-actions">
          <button type="submit" id="save-button">Save Transaction</button>
          <button type="button" id="cancel-button" class="cancel-button">Cancel</button>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
