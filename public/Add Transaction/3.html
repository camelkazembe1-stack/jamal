<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15803d">
  <title>JAMALI | Add Transaction</title>
  <link rel="stylesheet" href="./3.css">
  <script src="/sidebar.js" defer></script>
  <script type="module" src="./3.js"></script>
</head>
<body>
  <main class="transaction-page">
    <header class="page-header">
      <div>
        <p class="eyebrow">JAMALI ACCOUNTING</p>
        <h1>Add Transaction</h1>
        <p class="subtitle">Record and review your business transactions.</p>
      </div>
      <button type="button" id="display-transactions" class="button button-secondary">
        Display Transactions
      </button>
    </header>

    <div id="status-message" class="status-message" role="status" aria-live="polite"></div>

    <section class="panel">
      <h2>Choose transaction group</h2>
      <div class="group-grid">
        <button type="button" class="group-button group-in" data-flow="IN">
          <span>IN</span><small>Money coming in</small>
        </button>
        <button type="button" class="group-button group-out" data-flow="OUT">
          <span>OUT</span><small>Money going out</small>
        </button>
        <button type="button" class="group-button group-neutral" data-flow="NEUTRAL">
          <span>NEUTRAL</span><small>Retained profit</small>
        </button>
        <button type="button" class="group-button group-contra" data-flow="CONTRA">
          <span>CONTRA</span><small>Cash and bank transfers</small>
        </button>
      </div>
    </section>

    <section id="transaction-options-panel" class="panel" hidden>
      <h2 id="transaction-options-heading">Choose transaction</h2>
      <div id="transaction-options" class="option-grid"></div>
    </section>

    <section id="form-panel" class="panel" hidden>
      <h2 id="form-heading">Transaction details</h2>
      <form id="transaction-form">
        <div id="form-fields" class="form-grid"></div>
        <div class="form-actions">
          <button type="button" id="cancel-form" class="button button-secondary">Cancel</button>
          <button type="submit" id="save-transaction" class="button button-primary">Save</button>
        </div>
      </form>
    </section>

    <section id="transactions-panel" class="panel" hidden>
      <div class="section-heading">
        <div>
          <h2>Saved transactions</h2>
          <p class="muted">Transactions saved in Cloud Firestore.</p>
        </div>
        <button type="button" id="refresh-transactions" class="button button-secondary">Refresh</button>
      </div>
      <div id="transaction-groups"></div>
    </section>
  </main>
</body>
</html>
