<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Images to PowerPoint — JAMALI Convertor</title>
<link rel="stylesheet" href="/images-to-powerpoint/156.css">

<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>Images to PowerPoint</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">📽️ Presentation Tools</span>
    <span class="t-chip">Tool #92 of 256</span>
    <span class="t-chip">/images-to-powerpoint/156</span>
  </div>
<div class="t-panel">
  <div class="t-drop" id="drop">Drop the file here or click to choose<small id="drop-hint">Images (jpg, png, webp…)</small></div>
  <input type="file" id="file" accept="image/*" multiple hidden>
  <div class="t-row"><button class="t-btn" id="run">Run</button></div>
  <p class="t-msg" id="t-msg"></p>
  <ul class="t-files" id="files"></ul>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/images-to-powerpoint/156.js" defer></script>
