<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text to PDF — JAMALI Convertor</title>
<link rel="stylesheet" href="/text-to-pdf/65.css">

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>Text to PDF</h1><span class="t-star">★</span></div>
  <div class="t-chips">
    <span class="t-chip t-fam">📄 Text Conversion Tools</span>
    <span class="t-chip">Tool #1 of 256</span>
    <span class="t-chip">/text-to-pdf/65</span>
  </div>
<div class="t-panel"><label class="t-lab" for="in">Input</label><textarea class="t-in" id="in" placeholder="Paste or type here…"></textarea><div class="t-row"><button class="t-btn" id="run">Create PDF</button></div><div class="t-row t-grow"><label class="t-lab" for="fs">Font size</label><select class="t-sel" id="fs"><option>10</option><option selected>12</option><option>14</option><option>18</option></select></div><p class="t-msg" id="t-msg"></p><label class="t-lab" for="out">Preview (first 40 lines)</label><textarea class="t-out" id="out" readonly placeholder="Result appears here…"></textarea><div class="t-row"><button class="t-btn ghost" id="copy">Copy result</button><button class="t-btn ghost" id="dl-txt">Download .txt</button></div></div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/text-to-pdf/65.js" defer></script>
</body>
</html>
