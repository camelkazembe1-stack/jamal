<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video to Images — JAMALI Convertor</title>
<link rel="stylesheet" href="/video-to-images/218.css">

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>Video to Images</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🎬 Video Tools</span>
    <span class="t-chip">Tool #154 of 256</span>
    <span class="t-chip">/video-to-images/218</span>
  </div>
<div class="t-panel">
  <div class="t-drop" id="drop">Drop the file here or click to choose<small id="drop-hint">Video file</small></div>
  <input type="file" id="file" accept="video/*,.mp4,.webm,.mov" hidden>
  <div class="t-row"><button class="t-btn" id="run">Run</button></div>
  <p class="t-msg" id="t-msg"></p>
  <ul class="t-files" id="files"></ul>
</div><div class="t-panel">
  <div class="t-grid3">
    <div><label class="t-lab" for="fps">Frames per second</label><input class="t-in" id="fps" type="number" value="1" min="0.1" step="0.1"></div>
    <div><label class="t-lab" for="maxf">Max frames</label><input class="t-in" id="maxf" type="number" value="60" min="1" max="300"></div>
    <div><label class="t-lab" for="fmt">Format</label><select class="t-sel" id="fmt"><option value="png">PNG</option><option value="jpeg">JPG</option></select></div>
  </div>
  <div class="t-row"><button class="t-btn" id="run">Extract frames</button></div>
  <p class="t-msg" id="t-msg"></p>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/video-to-images/218.js" defer></script>
</body>
</html>
