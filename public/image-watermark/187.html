<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Watermark — JAMALI Convertor</title>
<link rel="stylesheet" href="/image-watermark/187.css">

<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>Image Watermark</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🖼️ Image Tools</span>
    <span class="t-chip">Tool #123 of 256</span>
    <span class="t-chip">/image-watermark/187</span>
  </div>
<div class="t-panel">
  <div class="t-drop" id="drop">Drop the file here or click to choose<small id="drop-hint">Image to watermark</small></div>
  <input type="file" id="file" accept="image/*" hidden>
  <div class="t-row"><button class="t-btn" id="run">Run</button></div>
  <p class="t-msg" id="t-msg"></p>
  <ul class="t-files" id="files"></ul>
</div><div class="t-panel">
  <img class="t-prev" id="prev" alt="" hidden>
  <div class="t-grid2">
    <div><label class="t-lab" for="wm">Watermark text</label><input class="t-in" id="wm" value="© JAMALI" placeholder="© Your Name"></div>
    <div><label class="t-lab" for="pos">Position</label><select class="t-sel" id="pos">
      <option value="br">Bottom right</option><option value="bl">Bottom left</option>
      <option value="tr">Top right</option><option value="tl">Top left</option><option value="c">Centre</option></select></div>
    <div><label class="t-lab" for="op">Opacity (%)</label><input class="t-in" id="op" type="number" value="50" min="5" max="100"></div>
    <div><label class="t-lab" for="sz">Size (%) of width</label><input class="t-in" id="sz" type="number" value="4" min="1" max="20"></div>
  </div>
  <div class="t-row"><button class="t-btn" id="run">Apply watermark</button></div>
  <p class="t-msg" id="t-msg"></p>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/image-watermark/187.js" defer></script>
</body>
</html>
