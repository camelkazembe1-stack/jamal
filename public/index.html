<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JMS Multsystem Management</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #172033;
      background: #f3f6fb;
    }
    #login-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .login-card {
      width: 100%;
      max-width: 460px;
      padding: 36px 28px;
      background: white;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 12px 40px #17203318;
    }
    h1 { margin-top: 0; }
    p { line-height: 1.6; }
    #google-login {
      display: inline-block;
      padding: 13px 22px;
      border: 0;
      border-radius: 9px;
      background: #1769e0;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    #google-login:disabled { opacity: .65; cursor: wait; }
    #status { overflow-wrap: anywhere; }
    #application {
      display: none;
      width: 100%;
      min-height: 100vh;
      border: 0;
      background: white;
    }
  </style>
</head>
<body>
  <main id="login-screen">
    <section class="login-card">
      <h1>Welcome to JMS Multsystem Management</h1>
      <p>Please login to save and secure your data.</p>
      <button id="google-login" type="button">Continue with Google</button>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <iframe
    id="application"
    title="JMS Multsystem Management application"
    allow="clipboard-read; clipboard-write"
  ></iframe>

  <script type="module" src="./single-url.js"></script>
</body>
</html>
