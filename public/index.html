<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAMALI — MultiSystem Management</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #e2e8f0; padding: 20px;
  }
  .card {
    background: #111827; border: 1px solid #1f2937; border-radius: 18px;
    padding: 44px 38px; width: 100%; max-width: 420px; text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
  }
  .logo {
    width: 62px; height: 62px; margin: 0 auto 18px; border-radius: 16px;
    background: linear-gradient(135deg, #38bdf8, #0ea5e9);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 22px; color: #fff; letter-spacing: 1px;
  }
  h1 { font-size: 22px; line-height: 1.35; margin-bottom: 10px; }
  h1 span { color: #38bdf8; }
  .sub { font-size: 14.5px; color: #94a3b8; margin-bottom: 28px; }
  .google-btn {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px;
    background: #fff; color: #1f2937; border: 0; border-radius: 12px;
    padding: 13px 16px; font-size: 15px; font-weight: 600; cursor: pointer; transition: .2s;
  }
  .google-btn:hover { background: #f1f5f9; transform: translateY(-1px); }
  .google-btn:disabled { opacity: .6; cursor: wait; transform: none; }
  .status { margin-top: 16px; font-size: 13px; color: #f87171; min-height: 18px; }
  .foot { margin-top: 26px; font-size: 12px; color: #475569; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">JA</div>
    <h1>Welcome to <span>Jamal MultiSystem Management</span></h1>
    <p class="sub">Please login to save and secure your data</p>

    <button class="google-btn" id="google-btn">
      <svg width="20" height="20" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continue with Google
    </button>

    <p class="status" id="status"></p>
    <p class="foot">JAMALI MultiSystem Management © <span id="year"></span></p>
  </div>

  <script type="module">
    import { auth, provider, onAuthStateChanged, signInWithPopup } from "/firebase.js";
    document.getElementById("year").textContent = new Date().getFullYear();

    const btn = document.getElementById("google-btn");
    const status = document.getElementById("status");

    // Already logged in? Go straight to home page
    onAuthStateChanged(auth, (user) => { if (user) location.replace("/home/1"); });

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      status.textContent = "";
      try {
        await signInWithPopup(auth, provider);
        location.href = "/home/1";   // success → home page
      } catch (err) {
        status.textContent = "Login failed: " + (err.message || err.code);
        btn.disabled = false;
      }
    });
  </script>
  <script src="/sidebar.js" defer></script>
</body>
</html>
