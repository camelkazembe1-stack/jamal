<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JMS Multsystem Management — Login</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; box-sizing: border-box; background: #f3f6fb;
      font-family: Arial, sans-serif; color: #172033;
    }
    main {
      width: 100%; max-width: 430px; box-sizing: border-box;
      padding: 36px 28px; border-radius: 18px; background: white;
      text-align: center; box-shadow: 0 12px 40px #17203318;
    }
    h1 { font-size: 27px; }
    p { line-height: 1.6; color: #596579; }
    button {
      width: 100%; padding: 14px; border: 0; border-radius: 9px;
      background: #1769e0; color: white; font-size: 16px;
      font-weight: bold; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #status { overflow-wrap: anywhere; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to JMS Multsystem Management</h1>
    <p>Please login to save and secure your data.</p>
    <button id="login" disabled>Loading secure login…</button>
    <p id="status" role="status" aria-live="polite">Connecting to Firebase…</p>
  </main>

  <script type="module">
    import { auth, googleProvider, authReady } from "./firebase.js";
    import {
      signInWithPopup,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

    const button = document.getElementById("login");
    const status = document.getElementById("status");
    let busy = false;

    try {
      await authReady;
      await auth.authStateReady();

      if (auth.currentUser) {
        window.location.replace("/home/app/");
      } else {
        button.disabled = false;
        button.textContent = "Continue with Google";
        status.textContent = "Please sign in with your Google account.";
      }
    } catch (error) {
      status.textContent = "Firebase initialization failed: " + error.message;
      console.error("Firebase initialization:", error);
    }

    button.addEventListener("click", async () => {
      if (busy) return;
      busy = true;
      button.disabled = true;
      button.textContent = "Signing in…";
      status.textContent = "Complete sign-in in the Google window.";

      try {
        await authReady;
        const result = await signInWithPopup(auth, googleProvider);

        if (!result.user) {
          throw new Error("Google sign-in returned no authenticated user.");
        }

        status.textContent = "Login successful. Opening your home page…";
        window.location.replace("/home/app/");
      } catch (error) {
        console.error("Google sign-in failed:", error);
        status.textContent = error.code
          ? error.code + ": " + error.message
          : error.message;

        button.disabled = false;
        button.textContent = "Try Google Login Again";
        busy = false;
      }
    });
  </script>
</body>
</html>
