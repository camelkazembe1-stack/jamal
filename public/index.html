<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>JAMALI - MultiSystem Management</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0f172a;
    }

    #jamali-app {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0;
    }
  </style>
</head>
<body>
  <iframe
    id="jamali-app"
    src="about:blank"
    title="JAMALI application"
    allow="clipboard-read; clipboard-write"
  ></iframe>
  <script>
    /* JAMALI root shell. Every page of the app opens inside this frame,
     * so the address bar only ever shows the site root. Pages announce
     * their moves through the bridge inside sidebar.js with postMessage; nothing is
     * redirected in the open and no route path reaches the interface.
     * The pages are plain files (/slug/number.html) - the shell and the
     * bridge keep those file addresses fully internal. */
    (function () {
      "use strict";

      var HOME = "/home/1.html";
      var BOOT_KEY = "JAMALI_BOOT_PAGE";
      var LAST_KEY = "JAMALI_LAST_PAGE";
      var STACK_KEY = "JAMALI_PAGE_STACK";
      var frame = document.getElementById("jamali-app");

      function norm(target) {
        var t = String(target == null ? "" : target).trim();
        if (!t) return null;
        if (t.charAt(0) === "#") return null;
        if (/^(https?:)?\/\//i.test(t)) return null;
        if (/^(mailto|tel|sms|blob|data|javascript|about|file):/i.test(t)) return null;
        if (t === "/" || t === "/index.html") return HOME;
        if (t.charAt(0) !== "/") return null;
        if (/^\/RESERVE(\/|$)/i.test(t)) return null;
        var m = t.match(/^([^?#]*)([?#].*)?$/);
        if (!m) return null;
        var path = m[1].replace(/\/+$/, "");
        var rest = m[2] || "";
        if (!path) return HOME;
        if (!/\.html$/i.test(path)) path += ".html";
        return path + rest;
      }

      /* If this shell was somehow served on a route path, quietly settle
       * the address bar back onto the root - no reload, no redirect. */
      if (location.pathname !== "/") {
        try { history.replaceState(null, "", "/" + (location.search || "") + (location.hash || "")); }
        catch (e) {}
      }

      /* Where to open first: a page that bounced in from its own route
       * wins, then a query typed on the root (for example /?mode=token),
       * then the page the user was on before a refresh, then home. */
      var boot = null;
      try {
        boot = sessionStorage.getItem(BOOT_KEY);
        sessionStorage.removeItem(BOOT_KEY);
      } catch (e) {}

      var topQuery = (location.search || "") + (location.hash || "");
      var last = null;
      try { last = sessionStorage.getItem(LAST_KEY); } catch (e) {}

      var initial = norm(boot) ||
        (topQuery ? norm(HOME + topQuery) : null) ||
        norm(last) || HOME;
      frame.src = initial;

      /* THE PAGE STACK - the shell moves pages with location.replace, so
       * the browser never builds history entries for them. The stack here
       * is the page history instead: every page the user reaches lands on
       * it, and the pages' back links ("<- Home", "<- Health", ...) ask
       * the shell to go back ONE step over it - to the page the user was
       * on before this one - instead of jumping straight to a hub. When
       * the stack has no earlier step left, the back link falls back to
       * its own target (the hub it points at), so it always works. The
       * stack survives a refresh through sessionStorage, newest last. */
      var stack = [];
      try {
        var rawStack = JSON.parse(sessionStorage.getItem(STACK_KEY) || "[]");
        if (Array.isArray(rawStack)) {
          for (var si = 0; si < rawStack.length; si++) {
            var sT = norm(rawStack[si]);
            if (sT && stack[stack.length - 1] !== sT) stack.push(sT);
          }
        }
      } catch (e) { stack = []; }
      function stackSave() {
        try { sessionStorage.setItem(STACK_KEY, JSON.stringify(stack.slice(-60))); } catch (e) {}
      }
      function stackPush(t) {
        if (!t || stack[stack.length - 1] === t) return;
        stack.push(t);
        if (stack.length > 60) stack = stack.slice(-60);
        stackSave();
      }
      function frameNav(t) {
        try { frame.contentWindow.location.replace(t); }
        catch (e) { frame.src = t; }
      }
      function frameHere() {
        try {
          var loc = frame.contentWindow.location;
          return loc.pathname + (loc.search || "") + (loc.hash || "");
        } catch (e) { return null; }
      }
      /* Back one step: drop the current page off the stack, reopen what
       * came before it. Nothing earlier left -> the link's own target. */
      function stackBack(fallback) {
        var cur = frameHere() || (stack.length ? stack[stack.length - 1] : null);
        var cut = -1, j;
        for (j = stack.length - 1; j >= 0; j--) {
          if (stack[j] === cur) { cut = j; break; }
        }
        stack = cut === -1 ? [] : stack.slice(0, cut);
        stackSave();
        var prev = stack.length ? stack[stack.length - 1] : null;
        if (prev && prev !== cur) {
          frameNav(prev);
          return;
        }
        var t = norm(fallback);
        if (t) { stackPush(t); frameNav(t); return; }
        /* No earlier step and no fallback target: reload this page. */
        if (cur) frameNav(cur);
      }

      stackPush(initial);

      window.addEventListener("message", function (ev) {
        if (ev.origin !== location.origin) return;
        var d = ev.data;
        if (!d || (d.type !== "JAMALI_NAV" && d.type !== "JAMALI_BACK")) return;
        var t = norm(d.target);
        if (d.type === "JAMALI_BACK") { stackBack(t); return; }
        if (!t) return;
        stackPush(t);
        frameNav(t);
      });

      /* Remember the page the user is on so a refresh reopens it inside
       * the root shell. */
      frame.addEventListener("load", function () {
        try {
          var here = frame.contentWindow.location;
          if (!here || here.protocol === "about:") return;
          var cur = here.pathname + (here.search || "") + (here.hash || "");
          if (cur && cur !== "/") sessionStorage.setItem(LAST_KEY, cur);
        } catch (e) {}
      });
    })();

    /* KEEP THE SYSTEM FROM BEING INSPECTED (demand 24 Nov 2026): the
     * same deterrent layer the pages carry from sidebar.js, on the
     * shell document itself - right-click menu, F12 and the
     * DevTools / view-source / save-page shortcuts are refused. */
    (function () {
      function stopInspect(e) { e.preventDefault(); e.stopPropagation(); return false; }
      document.addEventListener("contextmenu", stopInspect, true);
      document.addEventListener("keydown", function (e) {
        var k = (e.key || "").toUpperCase();
        if (k === "F12") return stopInspect(e);
        if ((e.ctrlKey || e.metaKey) && e.shiftKey &&
            (k === "I" || k === "J" || k === "C")) return stopInspect(e);
        if ((e.ctrlKey || e.metaKey) && !e.shiftKey &&
            (k === "U" || k === "S")) return stopInspect(e);
      }, true);
    })();
  </script>
</body>
</html>
