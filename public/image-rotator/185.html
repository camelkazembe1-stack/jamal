<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Rotator — JAMALI Convertor</title>
<link rel="stylesheet" href="/image-rotator/185.css">

<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>Image Rotator</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🖼️ Image Tools</span>
    <span class="t-chip">Tool #121 of 256</span>
    <span class="t-chip">/image-rotator/185</span>
  </div>
<div class="t-panel">
  <div class="t-drop" id="drop">Drop the file here or click to choose<small id="drop-hint">Image to rotate</small></div>
  <input type="file" id="file" accept="image/*" hidden>
  <div class="t-row"><button class="t-btn" id="run">Run</button></div>
  <p class="t-msg" id="t-msg"></p>
  <ul class="t-files" id="files"></ul>
</div><div class="t-panel">
  <img class="t-prev" id="prev" alt="" hidden>
  <div class="t-grid2">
    <div><label class="t-lab" for="deg">Angle (degrees, clockwise)</label><input class="t-in" id="deg" type="number" value="90"></div>
    <div><label class="t-lab" for="fit">Canvas</label><select class="t-sel" id="fit"><option value="1">Expand to fit</option><option value="0">Keep original size</option></select></div>
  </div>
  <div class="t-row"><button class="t-btn" id="run">Rotate</button></div>
  <p class="t-msg" id="t-msg"></p>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/image-rotator/185.js" defer></script>
</body>
</html>
