<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>JMS Business Management</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #172033;
      background: #f4f7fb;
    }

    .business-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 26px;
    }

    h1 { margin: 0; font-size: clamp(24px, 4vw, 34px); }
    p { line-height: 1.5; }

    .add-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 48px;
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      background: #198754;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .add-button:hover { background: #157347; }

    .panel {
      padding: 24px;
      background: white;
      border: 1px solid #e1e7ef;
      border-radius: 14px;
    }

    .muted { color: #69758a; }

    .form-panel {
      display: none;
      margin-bottom: 24px;
    }

    .form-panel.open { display: block; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full { grid-column: 1 / -1; }

    label { font-size: 14px; font-weight: 700; }

    input, select, textarea {
      width: 100%;
      min-height: 44px;
      padding: 11px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: white;
      color: #172033;
      font: inherit;
    }

    textarea { min-height: 85px; resize: vertical; }

    .form-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .secondary-button {
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: white;
      cursor: pointer;
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 13px 12px;
      border-bottom: 1px solid #e8edf4;
      white-space: nowrap;
    }

    th { font-size: 13px; color: #69758a; }

    .message { min-height: 20px; color: #176b42; }

    @media (max-width: 600px) {
      body { padding: 16px; }
      .business-header { align-items: stretch; }
      .add-button { width: 100%; }
      .panel { padding: 16px; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
    }
  </style>
</head>
<body>
  <header class="business-header">
    <div>
      <h1>Business</h1>
      <p class="muted">Manage your business transactions.</p>
    </div>
    <button class="add-button" id="add-transaction" type="button">
      <span aria-hidden="true">+</span> Add Transaction
    </button>
  </header>

  <section class="panel form-panel" id="transaction-panel">
    <h2>Add Transaction</h2>
    <form id="transaction-form">
      <div class="form-grid">
        <div class="field">
          <label for="transaction-type">Transaction type</label>
          <select id="transaction-type" required>
            <option value="Income">Income</option>
            <option value="Expense">Expense</option>
          </select>
        </div>

        <div class="field">
          <label for="transaction-date">Date</label>
          <input id="transaction-date" type="date" required>
        </div>

        <div class="field">
          <label for="transaction-description">Description</label>
          <input id="transaction-description" type="text"
                 maxlength="150" placeholder="What was the transaction for?" required>
        </div>

        <div class="field">
          <label for="transaction-amount">Amount</label>
          <input id="transaction-amount" type="number"
                 min="0.01" step="0.01" placeholder="0.00" required>
        </div>

        <div class="field full">
          <label for="transaction-notes">Notes (optional)</label>
          <textarea id="transaction-notes" maxlength="500"
                    placeholder="Additional details"></textarea>
        </div>
      </div>

      <div class="form-actions">
        <button class="add-button" type="submit">Save Transaction</button>
        <button class="secondary-button" id="cancel-transaction"
                type="button">Cancel</button>
      </div>
      <p class="message" id="form-message" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section class="panel">
    <h2>Transactions</h2>
    <p class="muted" id="empty-message">No transactions have been added yet.</p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Description</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody id="transaction-list"></tbody>
      </table>
    </div>
    <p class="muted" id="storage-note">
      Transactions on this page are stored in this browser only.
    </p>
  </section>

  <script>
    (() => {
      const storageKey = "jamali-business-transactions-v1";
      const panel = document.getElementById("transaction-panel");
      const form = document.getElementById("transaction-form");
      const message = document.getElementById("form-message");
      const list = document.getElementById("transaction-list");
      const empty = document.getElementById("empty-message");
      const dateInput = document.getElementById("transaction-date");

      const today = new Date();
      dateInput.value = [
        today.getFullYear(),
        String(today.getMonth() + 1).padStart(2, "0"),
        String(today.getDate()).padStart(2, "0")
      ].join("-");

      function readTransactions() {
        try {
          const value = JSON.parse(localStorage.getItem(storageKey) || "[]");
          return Array.isArray(value) ? value : [];
        } catch {
          return [];
        }
      }

      function renderTransactions() {
        const transactions = readTransactions();
        list.replaceChildren();
        empty.hidden = transactions.length > 0;

        for (const transaction of transactions) {
          const row = document.createElement("tr");
          const values = [
            transaction.date,
            transaction.type,
            transaction.description,
            Number(transaction.amount).toLocaleString(undefined, {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2
            })
          ];

          for (const value of values) {
            const cell = document.createElement("td");
            cell.textContent = String(value ?? "");
            row.appendChild(cell);
          }
          list.appendChild(row);
        }
      }

      document.getElementById("add-transaction").addEventListener("click", () => {
        panel.classList.add("open");
        message.textContent = "";
        document.getElementById("transaction-description").focus();
      });

      document.getElementById("cancel-transaction").addEventListener("click", () => {
        panel.classList.remove("open");
        form.reset();
        dateInput.value = new Date().toISOString().slice(0, 10);
        message.textContent = "";
      });

      form.addEventListener("submit", event => {
        event.preventDefault();

        const transaction = {
          id: (globalThis.crypto?.randomUUID?.() || String(Date.now())),
          type: document.getElementById("transaction-type").value,
          date: dateInput.value,
          description: document.getElementById("transaction-description").value.trim(),
          amount: Number(document.getElementById("transaction-amount").value),
          notes: document.getElementById("transaction-notes").value.trim()
        };

        if (!transaction.description || !transaction.date ||
            !Number.isFinite(transaction.amount) || transaction.amount <= 0) {
          message.textContent = "Enter a description, date, and valid positive amount.";
          return;
        }

        try {
          const transactions = readTransactions();
          transactions.unshift(transaction);
          localStorage.setItem(storageKey, JSON.stringify(transactions));
          form.reset();
          dateInput.value = new Date().toISOString().slice(0, 10);
          panel.classList.remove("open");
          message.textContent = "";
          renderTransactions();
        } catch {
          message.textContent = "Could not save in this browser. Check available storage.";
        }
      });

      window.addEventListener("storage", renderTransactions);
      renderTransactions();
    })();
  </script>
</body>
</html>
