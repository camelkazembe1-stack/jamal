<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Business | JAMALI</title>
  <link rel="stylesheet" href="/business/2.css">
</head>
<body>
  <main class="business-page">
    <header class="business-header">
      <h1>Business</h1>
      <p>Manage your business transactions and files.</p>
    </header>

    <section class="business-actions" aria-label="Business actions">
      <button class="business-action" id="add-transaction" type="button">
        <span class="action-icon" aria-hidden="true">＋</span>
        <span>Add Transaction</span>
      </button>
      <button class="business-action" id="view-file" type="button">
        <span class="action-icon" aria-hidden="true">▤</span>
        <span>View File</span>
      </button>
    </section>

    <section class="business-panel" id="business-panel" hidden></section>
  </main>
  <script src="/business/2.js"></script>
</body>
</html>
