<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087f5b">
  <meta name="description" content="JAMALI  home page">
  <title>JAMALI | Home</title>
  <link rel="stylesheet" href="/home/1.css">
  <script type="module" src="/home/1.js"></script>

<style id="jamali-global-square-buttons">
/* JAMALI GLOBAL BUTTON STANDARD: identical square dimensions everywhere */
:root {
  --jamali-button-size: 140px;
  --jamali-button-green: #16a34a;
  --jamali-button-green-hover: #15803d;
  --jamali-button-text: #ffffff;
}

button,
input[type="button"],
input[type="submit"],
input[type="reset"],
.jamali-square-button,
.btn,
.button,
a[data-jamali-page],
a.jamali-button {
  box-sizing: border-box !important;
  width: var(--jamali-button-size) !important;
  min-width: var(--jamali-button-size) !important;
  max-width: var(--jamali-button-size) !important;
  height: var(--jamali-button-size) !important;
  min-height: var(--jamali-button-size) !important;
  max-height: var(--jamali-button-size) !important;
  aspect-ratio: 1 / 1 !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  flex: 0 0 var(--jamali-button-size) !important;
  padding: 12px !important;
  margin: 6px !important;
  border: 0 !important;
  border-radius: 8px !important;
  background: var(--jamali-button-green) !important;
  color: var(--jamali-button-text) !important;
  font: inherit;
  font-weight: 700 !important;
  line-height: 1.35 !important;
  text-align: center !important;
  text-decoration: none !important;
  white-space: normal !important;
  overflow-wrap: anywhere !important;
  vertical-align: middle;
  cursor: pointer;
}

button:hover,
input[type="button"]:hover,
input[type="submit"]:hover,
input[type="reset"]:hover,
.jamali-square-button:hover,
.btn:hover,
.button:hover,
a[data-jamali-page]:hover,
a.jamali-button:hover {
  background: var(--jamali-button-green-hover) !important;
  color: var(--jamali-button-text) !important;
}

button:focus-visible,
input[type="button"]:focus-visible,
input[type="submit"]:focus-visible,
input[type="reset"]:focus-visible,
.jamali-square-button:focus-visible,
a[data-jamali-page]:focus-visible {
  outline: 3px solid #14532d !important;
  outline-offset: 3px !important;
}

/* Consistent layout when a page groups its navigation buttons. */
.jamali-button-grid {
  display: grid !important;
  grid-template-columns: repeat(auto-fit, var(--jamali-button-size)) !important;
  gap: 12px !important;
  align-items: start !important;
}

@media (max-width: 360px) {
  :root { --jamali-button-size: 120px; }
}
</style>

</head>
<body>
  <header>
    <p class="brand">JAMALI</p>
  </header>

  <main>

    <section class="systems" aria-label="JAMALI systems">
      <button id="business-button"
              class="business-button"
              type="button"
              aria-label="Open Business">
        <span class="business-title">Business</span>
      </button>
    </section>

    <div id="home-status"
         class="status"
         role="status"
         aria-live="polite"></div>
  </main>

  <footer>
    &copy; <span id="year"></span> JAMALI 
  </footer>

<script id="jamali-business-loader">
(() => {
  if (window.__jamaliBusinessLoaderInstalled) return;
  window.__jamaliBusinessLoaderInstalled = true;

  document.addEventListener("click", async event => {
    const control = event.target.closest("a, button");
    if (!control || !/^business$/i.test((control.textContent || "").trim())) return;
    event.preventDefault();

    try {
      const response = await fetch("/Business/2.html", { cache: "no-store" });
      if (!response.ok) throw new Error("Business page could not be loaded.");
      const source = await response.text();
      const parsed = new DOMParser().parseFromString(source, "text/html");

      document.title = "Business | JAMALI";
      document.head.querySelectorAll('[data-jamali-business-style]').forEach(node => node.remove());
      const css = document.createElement("link");
      css.rel = "stylesheet";
      css.href = "/business/2.css";
      css.dataset.jamaliBusinessStyle = "true";
      document.head.appendChild(css);

      document.body.innerHTML = parsed.body.innerHTML;
      const script = document.createElement("script");
      script.src = "/business/2.js";
      script.dataset.jamaliBusinessScript = "true";
      document.body.appendChild(script);
    } catch (error) {
      console.error(error);
      alert("The Business page could not be opened. Please check that it is deployed.");
    }
  });
})();
</script>

</body>
</html>
