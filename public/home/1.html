<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <meta name="description" content="JMS Multisystem Management home dashboard.">
  <title>Home Dashboard | JMS Multisystem Management</title>
  <link rel="stylesheet" href="/home/1.css">

<style id="jamali-systems-buttons-style">
  #jamali-systems {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
    width: 100%;
    max-width: 520px;
    margin: 24px 0;
  }
  .jamali-system-button {
    box-sizing: border-box;
    min-height: 130px;
    aspect-ratio: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    border-radius: 16px;
    text-decoration: none;
    font: 700 18px/1.3 system-ui, sans-serif;
    box-shadow: 0 4px 14px rgb(0 0 0 / 10%);
    transition: transform .15s ease, filter .15s ease;
  }
  .jamali-system-button:hover {
    transform: translateY(-3px);
    filter: brightness(.96);
  }
  .jamali-system-button:focus-visible {
    outline: 3px solid #111;
    outline-offset: 3px;
  }
  .jamali-health-button {
    background: #1677d2;
    color: #fff;
  }
  .jamali-business-button {
    background: #168447;
    color: #fff;
  }
  .jamali-system-icon {
    font-size: 34px;
    line-height: 1;
  }
  @media (max-width: 480px) {
    #jamali-systems { gap: 10px; }
    .jamali-system-button {
      min-height: 110px;
      font-size: 16px;
      border-radius: 12px;
    }
  }
</style>

</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="JMS Multisystem Management home">
      <span class="brand-mark" aria-hidden="true">JMS</span>
      <span class="brand-text">
        <span class="brand-title">JMS Multisystem Management</span>
        <span class="brand-subtitle">Home dashboard</span>
      </span>
    </a>

    <button id="logout" class="logout-button" type="button" hidden>
      Sign out
    </button>
  </header>

  <main class="page-content">
    <section class="welcome" aria-labelledby="welcome-title">
      <p class="eyebrow">YOUR WORKSPACE</p>
      <h1 id="welcome-title">Welcome</h1>
      <p class="welcome-description">Select a system to continue.</p>
    </section>

    <section class="systems-section" aria-labelledby="systems-title">
      <div class="section-heading">
        <h2 id="systems-title">Your systems</h2>
        <span class="system-count">1 system</span>
      </div>

      <nav id="dashboard-buttons" class="dashboard-grid"
           aria-label="Available systems">
        <button
          type="button"
          class="dashboard-button business-button"
          id="business-button"
          aria-label="Open Business"
        >
          <span class="tile-top">
            <span class="button-icon" aria-hidden="true">B</span>
            <span class="tile-arrow" aria-hidden="true">↗</span>
          </span>
          <span class="button-label">Business</span>
          <span class="button-description">Manage business transactions</span>
        </button>
      </nav>
    </section>

    <p id="dashboard-status" class="dashboard-status"
       role="status" aria-live="polite"></p>

    <footer class="dashboard-footer">
      <span>JMS Multisystem Management</span>
      <span>Management made simple.</span>
    </footer>
  </main>

  <script type="module" src="/home/1.js"></script>

<section id="jamali-systems" aria-label="JAMALI systems">
  <a class="jamali-system-button jamali-health-button"
     href="/health/4.html">
    <span class="jamali-system-icon" aria-hidden="true">✚</span>
    <span>Health</span>
  </a>
  <a class="jamali-system-button jamali-business-button"
     href="/business/3.html">
    <span class="jamali-system-icon" aria-hidden="true">▦</span>
    <span>Business</span>
  </a>
</section>

</body>
</html>
