<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video to Audio — JAMALI Convertor</title>
<link rel="stylesheet" href="/video-to-audio/225.css">

<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>Video to Audio</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🎬 Video Tools</span>
    <span class="t-chip">Tool #161 of 256</span>
    <span class="t-chip">/video-to-audio/225</span>
  </div>
<div class="t-panel">
  <div class="t-drop" id="drop">Drop the file here or click to choose<small id="drop-hint">Video file</small></div>
  <input type="file" id="file" accept="video/*,.mp4,.webm,.mov,.mkv" hidden>
  <div class="t-row"><button class="t-btn" id="run">Run</button></div>
  <p class="t-msg" id="t-msg"></p>
  <ul class="t-files" id="files"></ul>
</div><div class="t-panel">
  <div class="t-grow"><label class="t-lab" for="fmt">Output</label><select class="t-sel" id="fmt">
    <option value="mp3">MP3 (128k)</option><option value="wav">WAV</option></select></div>
  <div class="t-row"><button class="t-btn" id="run">Extract audio</button></div>
  <p class="t-msg" id="t-msg"></p>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/video-to-audio/225.js" defer></script>
</body>
</html>
