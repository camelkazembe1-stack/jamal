<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Transactions — JAMALI</title>
<link rel="stylesheet" href="/all-transactions/5.css">
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <h1>All Transactions</h1>
  <p class="sub">Every saved transaction from IN, OUT, NEUTRAL and CONTRA. Bank charges appear as their own rows. Updates live.</p>

  <div class="tabs" id="tabs" role="tablist" aria-label="Filter by transaction type">
    <button class="tab is-active" type="button" data-type="ALL">All <span class="n">0</span></button>
    <button class="tab" type="button" data-type="IN">IN <span class="n">0</span></button>
    <button class="tab" type="button" data-type="OUT">OUT <span class="n">0</span></button>
    <button class="tab" type="button" data-type="NEUTRAL">NEUTRAL <span class="n">0</span></button>
    <button class="tab" type="button" data-type="CONTRA">CONTRA <span class="n">0</span></button>
  </div>

  <div class="card table-card" id="table-card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th scope="col">Transaction Name</th>
            <th scope="col">Date &amp; Time</th>
            <th scope="col">Flow Method</th>
            <th scope="col">Transaction Type</th>
            <th scope="col">Name</th>
            <th scope="col" class="col-amount">Amount</th>
          </tr>
        </thead>
        <tbody id="txn-body"></tbody>
      </table>
    </div>
  </div>

  <div class="card empty" id="empty-state" hidden>
    <div class="empty-icon">&#129534;</div>
    <p class="empty-title">No transactions yet</p>
    <p class="empty-sub">Save your first one in <a href="/add-transaction/3">Add Transaction</a> &mdash; it will appear here instantly.</p>
  </div>

  <p class="count-line" id="count-line"></p>
</main>
<script type="module" src="/all-transactions/5.js"></script>
</body>
</html>
