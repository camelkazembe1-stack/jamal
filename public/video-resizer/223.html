<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Resizer — JAMALI Convertor</title>
<link rel="stylesheet" href="/video-resizer/223.css">

<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>Video Resizer</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🎬 Video Tools</span>
    <span class="t-chip">Tool #159 of 256</span>
    <span class="t-chip">/video-resizer/223</span>
  </div>
<div class="t-note">The transcode runs in real time — a 2-minute video takes about 2 minutes.
Keep this tab visible while it records.</div><div class="t-panel">
  <div class="t-drop" id="drop">Drop the file here or click to choose<small id="drop-hint">Video file</small></div>
  <input type="file" id="file" accept="video/*,.mp4,.webm,.mov" hidden>
  <div class="t-row"><button class="t-btn" id="run">Run</button></div>
  <p class="t-msg" id="t-msg"></p>
  <ul class="t-files" id="files"></ul>
</div><div class="t-panel">
  <div class="t-grow"><label class="t-lab" for="wid">Target width (px)</label><select class="t-sel" id="wid">
    <option value="640">640</option><option value="854" selected>854</option><option value="1280">1280</option><option value="1920">1920</option></select></div>
  <div class="t-row"><button class="t-btn" id="run">Resize</button></div>
  <p class="t-msg" id="t-msg"></p>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/video-resizer/223.js" defer></script>
</body>
</html>
