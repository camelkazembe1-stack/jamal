<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAR to ZIP — JAMALI Convertor</title>
<link rel="stylesheet" href="/tar-to-zip/268.css">

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>TAR to ZIP</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🗜️ Archive and Compression Tools</span>
    <span class="t-chip">Tool #204 of 256</span>
    <span class="t-chip">/tar-to-zip/268</span>
  </div>
  <div class="t-note">Extracts the archive contents and repacks them — it does not just rename the file.</div>
<div class="t-panel">
  <div class="t-drop" id="drop">Drop the file here or click to choose<small id="drop-hint">TAR archive</small></div>
  <input type="file" id="file" accept=".tar,application/x-tar" hidden>
  <div class="t-row"><button class="t-btn" id="run">Run</button></div>
  <p class="t-msg" id="t-msg"></p>
  <ul class="t-files" id="files"></ul>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/tar-to-zip/268.js" defer></script>
</body>
</html>
