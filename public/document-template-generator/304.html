<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Template Generator — JAMALI Convertor</title>
<link rel="stylesheet" href="/document-template-generator/304.css">

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>Document Template Generator</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🗂️ Document and Office Utilities</span>
    <span class="t-chip">Tool #240 of 256</span>
    <span class="t-chip">/document-template-generator/304</span>
  </div>
<div class="t-panel">
  <div class="t-grid2">
    <div><label class="t-lab" for="kind">Template</label><select class="t-sel" id="kind">
      <option value="invoice">Invoice</option><option value="letter">Business letter</option>
      <option value="memo">Memo</option><option value="minutes">Meeting minutes</option>
      <option value="receipt">Receipt</option></select></div>
    <div><label class="t-lab" for="org">Your company / name</label><input class="t-in" id="org" value="JAMALI Trading"></div>
    <div><label class="t-lab" for="to">To / client</label><input class="t-in" id="to" value="Acme Ltd"></div>
    <div><label class="t-lab" for="subj">Subject / reference</label><input class="t-in" id="subj" value="Order 1042"></div>
    <div><label class="t-lab" for="amt">Amount (for invoice / receipt)</label><input class="t-in" id="amt" value="1,250.00"></div>
    <div><label class="t-lab" for="cur">Currency</label><input class="t-in" id="cur" value="USD"></div>
  </div>
  <div class="t-row"><button class="t-btn" id="run">Generate .docx</button></div>
  <label class="t-lab" for="out">Preview</label>
  <textarea class="t-out" id="out" readonly placeholder="The document text appears here…"></textarea>
  <p class="t-msg" id="t-msg"></p>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/document-template-generator/304.js" defer></script>
</body>
</html>
