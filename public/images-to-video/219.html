<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Images to Video — JAMALI Convertor</title>
<link rel="stylesheet" href="/images-to-video/219.css">

<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>Images to Video</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🎬 Video Tools</span>
    <span class="t-chip">Tool #155 of 256</span>
    <span class="t-chip">/images-to-video/219</span>
  </div>
<div class="t-panel">
  <div class="t-drop" id="drop">Drop the file here or click to choose<small id="drop-hint">Images in order</small></div>
  <input type="file" id="file" accept="image/*" multiple hidden>
  <div class="t-row"><button class="t-btn" id="run">Run</button></div>
  <p class="t-msg" id="t-msg"></p>
  <ul class="t-files" id="files"></ul>
</div><div class="t-panel">
  <div class="t-grow"><label class="t-lab" for="sec">Seconds per image</label>
    <input class="t-in" id="sec" type="number" value="2" min="0.5" step="0.5"></div>
  <div class="t-row"><button class="t-btn" id="run">Create video</button></div>
  <p class="t-msg" id="t-msg"></p>
</div><div class="t-note">The transcode runs in real time — a 2-minute video takes about 2 minutes.
Keep this tab visible while it records.</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/images-to-video/219.js" defer></script>
</body>
</html>
