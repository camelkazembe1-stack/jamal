<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Diff Checker — JAMALI Convertor</title>
<link rel="stylesheet" href="/text-diff-checker/295.css">

<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>Text Diff Checker</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🗂️ Document and Office Utilities</span>
    <span class="t-chip">Tool #231 of 256</span>
    <span class="t-chip">/text-diff-checker/295</span>
  </div>
<div class="t-panel">
  <div class="t-grid2">
    <div><label class="t-lab" for="a">Original</label><textarea class="t-in" id="a" placeholder="Paste the original…"></textarea></div>
    <div><label class="t-lab" for="b">Changed</label><textarea class="t-in" id="b" placeholder="Paste the changed version…"></textarea></div>
  </div>
  <div class="t-row"><button class="t-btn" id="run">Compare</button></div>
  <p class="t-msg" id="t-msg"></p>
</div>
<div class="t-panel"><label class="t-lab">Differences</label><div class="t-diff" id="out"></div></div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/text-diff-checker/295.js" defer></script>
</body>
</html>
