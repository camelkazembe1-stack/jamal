<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text to Excel — JAMALI Convertor</title>
<link rel="stylesheet" href="/text-to-excel/150.css">

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>Text to Excel</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">📊 Spreadsheet and Data Tools</span>
    <span class="t-chip">Tool #86 of 256</span>
    <span class="t-chip">/text-to-excel/150</span>
  </div>
<div class="t-panel"><label class="t-lab" for="in">Input</label><textarea class="t-in" id="in" placeholder="Paste or type here…"></textarea><div class="t-row"><button class="t-btn" id="run">Create .xlsx</button></div><div class="t-row t-grow"><label class="t-lab" for="delim">Split fields by</label><select class="t-sel" id="delim"><option value="\t">Tab</option><option value=",">Comma</option><option value=";">Semicolon</option><option value="|">Pipe</option><option value=" ">Spaces</option></select></div><p class="t-msg" id="t-msg"></p><label class="t-lab" for="out">Output</label><textarea class="t-out" id="out" readonly placeholder="Result appears here…"></textarea><div class="t-row"><button class="t-btn ghost" id="copy">Copy result</button><button class="t-btn ghost" id="dl-txt">Download .txt</button></div></div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/text-to-excel/150.js" defer></script>
</body>
</html>
