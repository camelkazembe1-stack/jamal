<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MP4 to GIF — JAMALI Convertor</title>
<link rel="stylesheet" href="/mp4-to-gif/217.css">

<script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js"></script>
<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>MP4 to GIF</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🎬 Video Tools</span>
    <span class="t-chip">Tool #153 of 256</span>
    <span class="t-chip">/mp4-to-gif/217</span>
  </div>
<div class="t-panel">
  <div class="t-drop" id="drop">Drop the file here or click to choose<small id="drop-hint">Video file</small></div>
  <input type="file" id="file" accept="video/*,.mp4,.webm,.mov" hidden>
  <div class="t-row"><button class="t-btn" id="run">Run</button></div>
  <p class="t-msg" id="t-msg"></p>
  <ul class="t-files" id="files"></ul>
</div><div class="t-panel">
  <div class="t-grid3">
    <div><label class="t-lab" for="fps">Frames per second</label><select class="t-sel" id="fps"><option>8</option><option selected>12</option><option>15</option></select></div>
    <div><label class="t-lab" for="wid">Width (px)</label><select class="t-sel" id="wid"><option>240</option><option selected>320</option><option>480</option></select></div>
    <div><label class="t-lab" for="dur">Seconds (0 = all)</label><input class="t-in" id="dur" type="number" value="0" min="0" step="0.5"></div>
  </div>
  <div class="t-row"><button class="t-btn" id="run">Create GIF</button></div>
  <p class="t-msg" id="t-msg"></p>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/mp4-to-gif/217.js" defer></script>
</body>
</html>
