<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timestamp Converter — JAMALI Convertor</title>
<link rel="stylesheet" href="/timestamp-converter/289.css">

<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>Timestamp Converter</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🧰 File Utilities</span>
    <span class="t-chip">Tool #225 of 256</span>
    <span class="t-chip">/timestamp-converter/289</span>
  </div>
<div class="t-panel">
  <div class="t-grid3">
    <div><label class="t-lab" for="ts">Unix timestamp</label><input class="t-in" id="ts" placeholder="e.g. 1735689600"></div>
    <div><label class="t-lab" for="unit">Unit</label><select class="t-sel" id="unit"><option value="s">Seconds</option><option value="ms">Milliseconds</option></select></div>
    <div><label class="t-lab" for="dt">…or date/time</label><input class="t-in" id="dt" type="datetime-local"></div>
  </div>
  <div class="t-row"><button class="t-btn" id="run-ts">Timestamp → date</button>
  <button class="t-btn" id="run-dt">Date → timestamp</button>
  <button class="t-btn ghost" id="now">Now</button></div>
  <table class="t-kv" id="kv" hidden></table>
  <p class="t-msg" id="t-msg"></p>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/timestamp-converter/289.js" defer></script>
</body>
</html>
