<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Cropper — JAMALI Convertor</title>
<link rel="stylesheet" href="/image-cropper/184.css">

<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>Image Cropper</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🖼️ Image Tools</span>
    <span class="t-chip">Tool #120 of 256</span>
    <span class="t-chip">/image-cropper/184</span>
  </div>
<div class="t-panel">
  <div class="t-drop" id="drop">Drop the file here or click to choose<small id="drop-hint">Image to crop</small></div>
  <input type="file" id="file" accept="image/*" hidden>
  <div class="t-row"><button class="t-btn" id="run">Run</button></div>
  <p class="t-msg" id="t-msg"></p>
  <ul class="t-files" id="files"></ul>
</div><div class="t-panel">
  <img class="t-prev" id="prev" alt="" hidden>
  <div class="t-grid2">
    <div><label class="t-lab" for="x">Left x (px)</label><input class="t-in" id="x" type="number" value="0" min="0"></div>
    <div><label class="t-lab" for="y">Top y (px)</label><input class="t-in" id="y" type="number" value="0" min="0"></div>
    <div><label class="t-lab" for="cw">Width (px)</label><input class="t-in" id="cw" type="number" placeholder="to edge"></div>
    <div><label class="t-lab" for="ch">Height (px)</label><input class="t-in" id="ch" type="number" placeholder="to edge"></div>
  </div>
  <div class="t-row"><button class="t-btn" id="run">Crop</button></div>
  <p class="t-msg" id="t-msg"></p>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/image-cropper/184.js" defer></script>
</body>
</html>
