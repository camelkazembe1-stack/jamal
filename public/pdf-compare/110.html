<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Compare — JAMALI Convertor</title>
<link rel="stylesheet" href="/pdf-compare/110.css">

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>PDF Compare</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">📕 PDF Tools</span>
    <span class="t-chip">Tool #46 of 256</span>
    <span class="t-chip">/pdf-compare/110</span>
  </div>
<div class="t-panel">
  <div class="t-drop" id="drop">Drop the file here or click to choose<small id="drop-hint">First PDF</small></div>
  <input type="file" id="file" accept=".pdf,application/pdf" hidden>
  <div class="t-row"><button class="t-btn" id="run">Run</button></div>
  <p class="t-msg" id="t-msg"></p>
  <ul class="t-files" id="files"></ul>
</div><div class="t-panel">
  <div class="t-drop" id="drop2">Drop the second PDF here or click<small>also .pdf</small></div>
  <input type="file" id="file2" accept=".pdf,application/pdf" hidden>
  <div class="t-row"><button class="t-btn" id="run">Compare</button></div>
  <p class="t-msg" id="t-msg"></p>
</div>
<div class="t-panel"><label class="t-lab">Differences (green = only in file 2, red = only in file 1)</label>
  <div class="t-diff" id="out"></div></div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/pdf-compare/110.js" defer></script>
</body>
</html>
