<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="/audio-merger/204.css">

<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>

<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>Audio Merger</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🎵 Audio Tools</span>
    <span class="t-chip">Tool #140 of 256</span>
    <span class="t-chip">/audio-merger/204</span>
  </div>
<div class="t-panel">
  <div class="t-drop" id="drop">Drop the file here or click to choose<small id="drop-hint">Two or more audio files, in order</small></div>
  <input type="file" id="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg" multiple hidden>
  <div class="t-row"><button class="t-btn" id="run">Run</button></div>
  <p class="t-msg" id="t-msg"></p>
  <ul class="t-files" id="files"></ul>
</div><div class="t-panel">
  <div class="t-row"><button class="t-btn" id="run">Merge</button></div>
  <p class="t-msg" id="t-msg"></p>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/audio-merger/204.js" defer></script>
