<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Merger — JAMALI Convertor</title>
<link rel="stylesheet" href="/document-merger/296.css">

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>Document Merger</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🗂️ Document and Office Utilities</span>
    <span class="t-chip">Tool #232 of 256</span>
    <span class="t-chip">/document-merger/296</span>
  </div>
<div class="t-panel">
  <div class="t-drop" id="drop">Drop the file here or click to choose<small id="drop-hint">Text/Word files, in merge order</small></div>
  <input type="file" id="file" accept=".txt,.text,.docx,text/plain" multiple hidden>
  <div class="t-row"><button class="t-btn" id="run">Run</button></div>
  <p class="t-msg" id="t-msg"></p>
  <ul class="t-files" id="files"></ul>
</div><div class="t-panel">
  <div class="t-grow"><label class="t-lab" for="fmt">Output format</label><select class="t-sel" id="fmt">
    <option value="docx">.docx (Word)</option><option value="txt">.txt (plain)</option></select></div>
  <div class="t-row"><button class="t-btn" id="run">Merge</button></div>
  <p class="t-msg" id="t-msg"></p>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/document-merger/296.js" defer></script>
</body>
</html>
