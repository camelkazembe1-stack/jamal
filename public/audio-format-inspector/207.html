<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Format Inspector — JAMALI Convertor</title>
<link rel="stylesheet" href="/audio-format-inspector/207.css">

<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>Audio Format Inspector</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🎵 Audio Tools</span>
    <span class="t-chip">Tool #143 of 256</span>
    <span class="t-chip">/audio-format-inspector/207</span>
  </div>
<div class="t-panel">
  <div class="t-drop" id="drop">Drop the file here or click to choose<small id="drop-hint">Audio file</small></div>
  <input type="file" id="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac" hidden>
  <div class="t-row"><button class="t-btn" id="run">Run</button></div>
  <p class="t-msg" id="t-msg"></p>
  <ul class="t-files" id="files"></ul>
</div><div class="t-panel">
  <table class="t-kv" id="kv" hidden></table>
  <div class="t-row"><button class="t-btn" id="run">Inspect</button></div>
  <p class="t-msg" id="t-msg"></p>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/audio-format-inspector/207.js" defer></script>
</body>
</html>
