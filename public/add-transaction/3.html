<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Transaction — JAMALI</title>
<link rel="stylesheet" href="/add-transaction/3.css">
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">

  <!-- STEP 1 · transaction type -->
  <section class="step is-active" id="step-1">
    <a class="back" href="/business/2">&larr; Business</a>
    <h1>Add Transaction</h1>
    <p class="sub">Step 1 of 3 — choose the transaction type.</p>
    <div class="grid" id="type-grid"></div>
  </section>

  <!-- STEP 2 · transaction -->
  <section class="step" id="step-2">
    <button class="back" id="back-2" type="button">&larr; Type</button>
    <h1 id="type-title">Type</h1>
    <p class="sub">Step 2 of 3 — choose the transaction.</p>
    <div class="grid" id="txn-grid"></div>
  </section>

  <!-- STEP 3 · details -->
  <section class="step" id="step-3">
    <button class="back" id="back-3" type="button">&larr; Transactions</button>
    <h1 id="txn-title">Transaction</h1>
    <p class="sub" id="txn-sub">Step 3 of 3</p>

    <div class="card form-card">
      <div class="field" id="f-amount">
        <label for="in-amount">Amount</label>
        <input id="in-amount" type="number" inputmode="decimal" min="0" step="any" placeholder="0.00">
      </div>

      <div class="field" id="f-method" hidden>
        <label>Flow Method</label>
        <div class="seg seg-3" id="method-seg"></div>
      </div>

      <div class="field" id="f-person" hidden>
        <label for="in-person">Person's Name</label>
        <input id="in-person" type="text" placeholder="e.g. Customer A">
      </div>

      <div class="field" id="f-bank" hidden>
        <label for="in-bank">Bank Name</label>
        <input id="in-bank" type="text" placeholder="e.g. Bank A">
      </div>

      <div class="field" id="f-charges" hidden>
        <label>Bank Charges</label>
        <div class="seg seg-2" id="charges-seg">
          <button class="seg-btn" type="button" data-v="WITH">With Charges</button>
          <button class="seg-btn" type="button" data-v="WITHOUT">Without Charges</button>
        </div>
      </div>

      <div class="field" id="f-charges-amount" hidden>
        <label for="in-charges">Charges Amount</label>
        <input id="in-charges" type="number" inputmode="decimal" min="0" step="any" placeholder="0.00">
      </div>

      <p class="preview" id="preview"></p>
      <p class="form-err" id="form-err" hidden></p>
      <button class="save-btn" id="save-btn" type="button">Save Transaction</button>
    </div>
  </section>

  <!-- STEP 4 · saved -->
  <section class="step" id="step-4">
    <div class="card done-card">
      <div class="done-icon">&#10003;</div>
      <h1>Transaction Saved</h1>
      <p class="sub" id="done-note">1 record saved to Firestore.</p>
      <div class="done-actions">
        <button class="ghost-btn" id="again-btn" type="button">Add Another</button>
        <a class="cta-btn" href="/all-transactions/5">View All Transactions</a>
      </div>
    </div>
  </section>

</main>
<script type="module" src="/add-transaction/3.js"></script>
</body>
</html>
