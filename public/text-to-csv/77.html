<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text to CSV — JAMALI Convertor</title>
<link rel="stylesheet" href="/text-to-csv/77.css">

<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>Text to CSV</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">📄 Text Conversion Tools</span>
    <span class="t-chip">Tool #13 of 256</span>
    <span class="t-chip">/text-to-csv/77</span>
  </div>
<div class="t-panel"><label class="t-lab" for="in">Input</label><textarea class="t-in" id="in" placeholder="Paste or type here…"></textarea><div class="t-row"><button class="t-btn" id="run">Convert</button></div><div class="t-row t-grow"><label class="t-lab" for="delim">Split fields by</label><select class="t-sel" id="delim"><option value=",">Comma</option><option value="\t">Tab</option><option value=";">Semicolon</option><option value="|">Pipe</option></select></div><p class="t-msg" id="t-msg"></p><label class="t-lab" for="out">Output</label><textarea class="t-out" id="out" readonly placeholder="Result appears here…"></textarea><div class="t-row"><button class="t-btn ghost" id="copy">Copy result</button><button class="t-btn ghost" id="dl-txt">Download .txt</button></div></div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/text-to-csv/77.js" defer></script>
