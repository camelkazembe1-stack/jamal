<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch File Renamer — JAMALI Convertor</title>
<link rel="stylesheet" href="/batch-file-renamer/278.css">

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>Batch File Renamer</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🧰 File Utilities</span>
    <span class="t-chip">Tool #214 of 256</span>
    <span class="t-chip">/batch-file-renamer/278</span>
  </div>
<div class="t-panel">
  <div class="t-drop" id="drop">Drop the file here or click to choose<small id="drop-hint">Files to rename (2 or more)</small></div>
  <input type="file" id="file" accept="" multiple hidden>
  <div class="t-row"><button class="t-btn" id="run">Run</button></div>
  <p class="t-msg" id="t-msg"></p>
  <ul class="t-files" id="files"></ul>
</div><div class="t-panel">
  <div class="t-grid3">
    <div><label class="t-lab" for="pre">Prefix</label><input class="t-in" id="pre" placeholder="e.g. receipt-"></div>
    <div><label class="t-lab" for="suf">Suffix</label><input class="t-in" id="suf" placeholder="e.g. -2024"></div>
    <div><label class="t-lab" for="start">Number from</label><input class="t-in" id="start" type="number" value="1" min="0"></div>
  </div>
  <div class="t-row"><button class="t-btn" id="run">Rename all &amp; zip</button></div>
  <p class="t-msg" id="t-msg"></p>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/batch-file-renamer/278.js" defer></script>
</body>
</html>
