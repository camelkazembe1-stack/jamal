<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator — JAMALI Convertor</title>
<link rel="stylesheet" href="/qr-code-generator/284.css">

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>QR Code Generator</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🧰 File Utilities</span>
    <span class="t-chip">Tool #220 of 256</span>
    <span class="t-chip">/qr-code-generator/284</span>
  </div>
<div class="t-panel">
  <div class="t-grid2">
    <div class="t-grow"><label class="t-lab" for="txt">Text or URL</label><input class="t-in" id="txt" placeholder="https://…"></div>
    <div class="t-grow"><label class="t-lab" for="sz">Size (px)</label><select class="t-sel" id="sz"><option>128</option><option selected>256</option><option>512</option></select></div>
  </div>
  <div class="t-row"><button class="t-btn" id="run">Generate QR</button></div>
  <div id="qrbox" style="display:inline-block;margin-top:10px"></div>
  <p class="t-msg" id="t-msg"></p>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/qr-code-generator/284.js" defer></script>

</html>
