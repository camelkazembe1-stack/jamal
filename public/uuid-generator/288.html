<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UUID Generator — JAMALI Convertor</title>
<link rel="stylesheet" href="/uuid-generator/288.css">

<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>UUID Generator</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🧰 File Utilities</span>
    <span class="t-chip">Tool #224 of 256</span>
    <span class="t-chip">/uuid-generator/288</span>
  </div>
<div class="t-panel">
  <div class="t-grid2">
    <div><label class="t-lab" for="n">How many</label><input class="t-in" id="n" type="number" value="10" min="1" max="500"></div>
    <div><label class="t-lab" for="case">Style</label><select class="t-sel" id="case">
      <option value="lower">lowercase</option><option value="upper">UPPERCASE</option><option value="braces">{braced}</option></select></div>
  </div>
  <div class="t-row"><button class="t-btn" id="run">Generate</button>
  <button class="t-btn ghost" id="copy">Copy all</button></div>
  <label class="t-lab" for="out">UUIDs</label>
  <textarea class="t-out" id="out" readonly placeholder="One UUID per line…"></textarea>
  <p class="t-msg" id="t-msg"></p>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/uuid-generator/288.js" defer></script>
</body>
</html>
