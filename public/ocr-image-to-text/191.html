<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCR Image to Text — JAMALI Convertor</title>
<link rel="stylesheet" href="/ocr-image-to-text/191.css">

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>OCR Image to Text</h1><span class="t-star">★</span></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🖼️ Image Tools</span>
    <span class="t-chip">Tool #127 of 256</span>
    <span class="t-chip">/ocr-image-to-text/191</span>
  </div>
<div class="t-panel">
  <div class="t-drop" id="drop">Drop the file here or click to choose<small id="drop-hint">Image with text</small></div>
  <input type="file" id="file" accept="image/*" hidden>
  <div class="t-row"><button class="t-btn" id="run">Run</button></div>
  <p class="t-msg" id="t-msg"></p>
  <ul class="t-files" id="files"></ul>
</div><div class="t-panel"><label class="t-lab" for="out">Recognized text</label>
  <textarea class="t-out" id="out" readonly placeholder="OCR text appears here…"></textarea>
  <div class="t-row"><button class="t-btn ghost" id="dl-txt">Download .txt</button></div>
  <p class="t-msg" id="t-msg"></p>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/ocr-image-to-text/191.js" defer></script>
</body>
</html>
