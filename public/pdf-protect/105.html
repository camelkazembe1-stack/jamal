<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Protect — JAMALI Convertor</title>
<link rel="stylesheet" href="/pdf-protect/105.css">

<script src="https://cdn.jsdelivr.net/npm/@cantoo/pdf-lib@2.4.0/dist/pdf-lib.min.js"></script>
<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>PDF Protect</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">📕 PDF Tools</span>
    <span class="t-chip">Tool #41 of 256</span>
    <span class="t-chip">/pdf-protect/105</span>
  </div>
  <div class="t-note">Only protect documents you are authorized to. Password stays in your browser.</div>
<div class="t-panel">
  <div class="t-drop" id="drop">Drop the file here or click to choose<small id="drop-hint">PDF file (.pdf)</small></div>
  <input type="file" id="file" accept=".pdf,application/pdf" hidden>
  <div class="t-row"><button class="t-btn" id="run">Run</button><div class="t-grow"><label class="t-lab" for="pw">User password (to open)</label><input class="t-in" id="pw" type="password" placeholder="required"></div><div class="t-grow"><label class="t-lab" for="ow">Owner password (to edit)</label><input class="t-in" id="ow" type="password" placeholder="optional"></div></div>
  <p class="t-msg" id="t-msg"></p>
  <ul class="t-files" id="files"></ul>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/pdf-protect/105.js" defer></script>
</body>
</html>
