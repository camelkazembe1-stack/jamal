<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Compressor — JAMALI Convertor</title>
<link rel="stylesheet" href="/video-compressor/220.css">

<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>Video Compressor</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🎬 Video Tools</span>
    <span class="t-chip">Tool #156 of 256</span>
    <span class="t-chip">/video-compressor/220</span>
  </div>
<div class="t-note">The transcode runs in real time — a 2-minute video takes about 2 minutes.
Keep this tab visible while it records.</div><div class="t-panel">
  <div class="t-drop" id="drop">Drop the file here or click to choose<small id="drop-hint">Video file</small></div>
  <input type="file" id="file" accept="video/*,.mp4,.webm,.mov,.mkv" hidden>
  <div class="t-row"><button class="t-btn" id="run">Run</button></div>
  <p class="t-msg" id="t-msg"></p>
  <ul class="t-files" id="files"></ul>
</div><div class="t-panel">
  <div class="t-grid2">
    <div><label class="t-lab" for="sc">Resolution</label><select class="t-sel" id="sc">
      <option value="0.5">Half</option><option value="0.75" selected>Three quarters</option><option value="1">Full</option></select></div>
    <div><label class="t-lab" for="vps">Target bitrate</label><select class="t-sel" id="vps">
      <option value="500000">500 kbps (tiny)</option><option value="1000000" selected>1 Mbps</option><option value="2000000">2 Mbps</option></select></div>
  </div>
  <div class="t-row"><button class="t-btn" id="run">Compress</button></div>
  <p class="t-msg" id="t-msg"></p>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/video-compressor/220.js" defer></script>
</body>
</html>
