<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View File — JAMALI</title>
<link rel="stylesheet" href="/view-file/4.css">
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/business/2">&larr; Business</a>
  <h1>View File</h1>
  <p class="sub">Pick a file to view.</p>

  <div class="grid">
    <a class="tile" href="/all-transactions/5">
      <span class="tile-icon">&#128202;</span>
      <span class="tile-label">All Transactions</span>
    </a>
    <a class="tile" href="/cash-book-single/15">
      <span class="tile-icon">&#128210;</span>
      <span class="tile-label">Cash Book</span>
    </a>
    <a class="tile" href="/cash-book/6">
      <span class="tile-icon">&#128214;</span>
      <span class="tile-label">Double Column Cash Book</span>
    </a>
    <a class="tile" href="/petty-cash/7">
      <span class="tile-icon">&#129689;</span>
      <span class="tile-label">Petty Cash Book</span>
    </a>
    <a class="tile" href="/sales-journal/8">
      <span class="tile-icon">&#128717;</span>
      <span class="tile-label">Sales Journal</span>
    </a>
    <a class="tile" href="/purchases-journal/9">
      <span class="tile-icon">&#128722;</span>
      <span class="tile-label">Purchases Journal</span>
    </a>
    <a class="tile" href="/sales-returns/10">
      <span class="tile-icon">&#8617;</span>
      <span class="tile-label">Sales Returns</span>
    </a>
    <a class="tile" href="/purchases-returns/11">
      <span class="tile-icon">&#8618;</span>
      <span class="tile-label">Purchases Returns</span>
    </a>
    <a class="tile" href="/general-journal/12">
      <span class="tile-icon">&#128211;</span>
      <span class="tile-label">General Journal</span>
    </a>
    <a class="tile" href="/cash-receipts/13">
      <span class="tile-icon">&#128181;</span>
      <span class="tile-label">Cash Receipts</span>
    </a>
    <a class="tile" href="/cash-payments/14">
      <span class="tile-icon">&#128184;</span>
      <span class="tile-label">Cash Payments</span>
    </a>
    <a class="tile" href="/creditors-book/16">
      <span class="tile-icon">&#127974;</span>
      <span class="tile-label">Creditors Book</span>
    </a>
    <a class="tile" href="/debtors-book/17">
      <span class="tile-icon">&#129309;</span>
      <span class="tile-label">Debtors Book</span>
    </a>
    <!-- more view file buttons: one .tile each, 8 per row -->
  </div>
</main>
<script type="module" src="/view-file/4.js"></script>
</body>
</html>
