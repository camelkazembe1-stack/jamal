<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Resizer — JAMALI Convertor</title>
<link rel="stylesheet" href="/image-resizer/183.css">

<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>Image Resizer</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🖼️ Image Tools</span>
    <span class="t-chip">Tool #119 of 256</span>
    <span class="t-chip">/image-resizer/183</span>
  </div>
<div class="t-panel">
  <div class="t-drop" id="drop">Drop the file here or click to choose<small id="drop-hint">Image to resize</small></div>
  <input type="file" id="file" accept="image/*" hidden>
  <div class="t-row"><button class="t-btn" id="run">Run</button></div>
  <p class="t-msg" id="t-msg"></p>
  <ul class="t-files" id="files"></ul>
</div><div class="t-panel">
  <img class="t-prev" id="prev" alt="" hidden>
  <div class="t-grid3">
    <div><label class="t-lab" for="w">Width (px)</label><input class="t-in" id="w" type="number" placeholder="auto"></div>
    <div><label class="t-lab" for="h">Height (px)</label><input class="t-in" id="h" type="number" placeholder="auto"></div>
    <div><label class="t-lab" for="pc">Or percent (%)</label><input class="t-in" id="pc" type="number" value="50" min="1"></div>
  </div>
  <div class="t-row"><button class="t-btn" id="run">Resize</button></div>
  <p class="t-msg" id="t-msg"></p>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/image-resizer/183.js" defer></script>
</body>
</html>
