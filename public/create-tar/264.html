<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create TAR — JAMALI Convertor</title>
<link rel="stylesheet" href="/create-tar/264.css">

<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>Create TAR</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🗜️ Archive and Compression Tools</span>
    <span class="t-chip">Tool #200 of 256</span>
    <span class="t-chip">/create-tar/264</span>
  </div>
<div class="t-panel">
  <div class="t-drop" id="drop">Drop the file here or click to choose<small id="drop-hint">Files to pack</small></div>
  <input type="file" id="file" accept="" multiple hidden>
  <div class="t-row"><button class="t-btn" id="run">Run</button></div>
  <p class="t-msg" id="t-msg"></p>
  <ul class="t-files" id="files"></ul>
</div><div class="t-panel">
  <div class="t-grow"><label class="t-lab" for="tname">Archive name</label><input class="t-in" id="tname" value="archive.tar"></div>
  <div class="t-row"><button class="t-btn" id="run">Create TAR</button></div>
  <p class="t-msg" id="t-msg"></p>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/create-tar/264.js" defer></script>
</body>
</html>
