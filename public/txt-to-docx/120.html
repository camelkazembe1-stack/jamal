<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TXT to DOCX — JAMALI Convertor</title>
<link rel="stylesheet" href="/txt-to-docx/120.css">

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>TXT to DOCX</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">📘 Word and Document Tools</span>
    <span class="t-chip">Tool #56 of 256</span>
    <span class="t-chip">/txt-to-docx/120</span>
  </div>
<div class="t-panel">
  <div class="t-drop" id="drop">Drop the file here or click to choose<small id="drop-hint">Text file (.txt)</small></div>
  <input type="file" id="file" accept=".txt,.text,text/plain" hidden>
  <div class="t-row"><button class="t-btn" id="run">Run</button></div>
  <p class="t-msg" id="t-msg"></p>
  <ul class="t-files" id="files"></ul>
</div><div class="t-panel"><label class="t-lab" for="in">…or paste the text here</label>
  <textarea class="t-in" id="in" placeholder="Paste or type the text here…"></textarea>
  <div class="t-row"><button class="t-btn" id="run">Create .docx</button></div>
  <p class="t-msg" id="t-msg"></p>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/txt-to-docx/120.js" defer></script>
</body>
</html>
