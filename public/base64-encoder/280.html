<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base64 Encoder — JAMALI Convertor</title>
<link rel="stylesheet" href="/base64-encoder/280.css">

<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>Base64 Encoder</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🧰 File Utilities</span>
    <span class="t-chip">Tool #216 of 256</span>
    <span class="t-chip">/base64-encoder/280</span>
  </div>
<div class="t-panel">
  <div class="t-drop" id="drop">Drop the file here or click to choose<small id="drop-hint">File to encode</small></div>
  <input type="file" id="file" accept="" hidden>
  <div class="t-row"><button class="t-btn" id="run">Run</button></div>
  <p class="t-msg" id="t-msg"></p>
  <ul class="t-files" id="files"></ul>
</div><div class="t-panel">
  <label class="t-lab" for="in">…or paste text</label>
  <textarea class="t-in" id="in" placeholder="Paste text to encode…"></textarea>
  <div class="t-row"><button class="t-btn" id="run">Encode</button></div>
  <label class="t-lab" for="out">Base64</label>
  <textarea class="t-out" id="out" readonly placeholder="Base64 appears here…"></textarea>
  <div class="t-row"><button class="t-btn ghost" id="copy">Copy</button>
  <button class="t-btn ghost" id="dl-txt">Download .b64</button></div>
  <p class="t-msg" id="t-msg"></p>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/base64-encoder/280.js" defer></script>
</body>
</html>
