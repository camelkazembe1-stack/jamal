<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive Content Viewer — JAMALI Convertor</title>
<link rel="stylesheet" href="/archive-content-viewer/269.css">

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>Archive Content Viewer</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🗜️ Archive and Compression Tools</span>
    <span class="t-chip">Tool #205 of 256</span>
    <span class="t-chip">/archive-content-viewer/269</span>
  </div>
<div class="t-panel">
  <div class="t-drop" id="drop">Drop the file here or click to choose<small id="drop-hint">ZIP, TAR or .tar.gz</small></div>
  <input type="file" id="file" accept=".zip,.tar,.gz,.tgz,application/zip,application/gzip,application/x-tar" hidden>
  <div class="t-row"><button class="t-btn" id="run">Run</button></div>
  <p class="t-msg" id="t-msg"></p>
  <ul class="t-files" id="files"></ul>
</div><div class="t-panel">
  <table class="t-kv" id="kv" hidden></table>
  <div class="t-row"><button class="t-btn" id="run">List contents</button></div>
  <p class="t-msg" id="t-msg"></p>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/archive-content-viewer/269.js" defer></script>
</body>
</html>
