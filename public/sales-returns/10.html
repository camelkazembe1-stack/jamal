<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Returns Journal — JAMALI</title>
<link rel="stylesheet" href="/journals/journal.css">
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/view-file/4">&larr; View File</a>
  <h1>Sales Returns Journal</h1>
  <p class="sub">Goods returned by customers from previous credit sales &mdash; recorded with the <b>Sales Return</b> tile.</p>

  <div class="card table-card" id="table-card">
    <div class="table-wrap">
      <table class="journal">
        <thead>
          <tr>
            <th scope="col">Date</th>
            <th scope="col">Name</th>
            <th scope="col" class="amt">Amount</th>
          </tr>
        </thead>
        <tbody id="j-body"></tbody>
        <tfoot id="j-foot"></tfoot>
      </table>
    </div>
  </div>

  <div class="card empty" id="empty-state" hidden>
    <div class="empty-icon">&#8617;</div>
    <p class="empty-title">No sales returns yet</p>
    <p class="empty-sub">Record the <b>Sales Return</b> tile in <a href="/add-transaction/3">Add Transaction</a> with Flow Method <b>Credit</b> &mdash; it will appear here instantly.</p>
  </div>

  <p class="count-line" id="count-line"></p>
</main>
<script type="module" src="/sales-returns/10.js"></script>
</body>
</html>
