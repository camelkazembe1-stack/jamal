<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF to Image — JAMALI Convertor</title>
<link rel="stylesheet" href="/pdf-to-image/92.css">

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>PDF to Image</h1><span class="t-star">★</span></div>
  <div class="t-chips">
    <span class="t-chip t-fam">📕 PDF Tools</span>
    <span class="t-chip">Tool #28 of 256</span>
    <span class="t-chip">/pdf-to-image/92</span>
  </div>
<div class="t-panel">
  <div class="t-drop" id="drop">Drop the file here or click to choose<small id="drop-hint">PDF file (.pdf)</small></div>
  <input type="file" id="file" accept=".pdf,application/pdf" hidden>
  <div class="t-row"><button class="t-btn" id="run">Run</button><div class="t-grow"><label class="t-lab" for="scale">Resolution</label><select class="t-sel" id="scale"><option value="1.5">Screen (1.5×)</option><option value="2" selected>Sharp (2×)</option><option value="3">Print (3×)</option></select></div></div>
  <p class="t-msg" id="t-msg"></p>
  <ul class="t-files" id="files"></ul>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/pdf-to-image/92.js" defer></script>
</body>
</html>
