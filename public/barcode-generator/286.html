<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barcode Generator — JAMALI Convertor</title>
<link rel="stylesheet" href="/barcode-generator/286.css">

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>Barcode Generator</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🧰 File Utilities</span>
    <span class="t-chip">Tool #222 of 256</span>
    <span class="t-chip">/barcode-generator/286</span>
  </div>
<div class="t-panel">
  <div class="t-grid3">
    <div class="t-grow"><label class="t-lab" for="val">Value</label><input class="t-in" id="val" value="JAMALI-2024"></div>
    <div class="t-grow"><label class="t-lab" for="fmt">Format</label><select class="t-sel" id="fmt">
      <option>CODE128</option><option>CODE39</option><option>EAN13</option><option>UPC</option>
      <option>ITF14</option><option>pharmacode</option></select></div>
    <div class="t-grow"><label class="t-lab" for="h">Height (px)</label><input class="t-in" id="h" type="number" value="100" min="20"></div>
  </div>
  <div class="t-row"><button class="t-btn" id="run">Generate barcode</button></div>
  <canvas id="bc" style="margin-top:10px;background:#fff"></canvas>
  <p class="t-msg" id="t-msg"></p>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/barcode-generator/286.js" defer></script>
</body>
</html>
