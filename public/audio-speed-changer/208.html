<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Speed Changer — JAMALI Convertor</title>
<link rel="stylesheet" href="/audio-speed-changer/208.css">

<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
<script src="/menu.js" defer></script>
<script src="/sidebar.js" defer></script>
</head>
<body>
<main class="wrap">
  <a class="back" href="/convertor/63">&larr; Convertor</a>
  <div class="t-head"><h1>Audio Speed Changer</h1></div>
  <div class="t-chips">
    <span class="t-chip t-fam">🎵 Audio Tools</span>
    <span class="t-chip">Tool #144 of 256</span>
    <span class="t-chip">/audio-speed-changer/208</span>
  </div>
<div class="t-panel">
  <div class="t-drop" id="drop">Drop the file here or click to choose<small id="drop-hint">Audio file</small></div>
  <input type="file" id="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg" hidden>
  <div class="t-row"><button class="t-btn" id="run">Run</button></div>
  <p class="t-msg" id="t-msg"></p>
  <ul class="t-files" id="files"></ul>
</div><div class="t-panel">
  <div class="t-grid2">
    <div><label class="t-lab" for="sp">Speed (×)</label><input class="t-in" id="sp" type="number" value="1.5" min="0.25" max="4" step="0.05"></div>
    <div><label class="t-lab" for="fmt">Output</label><select class="t-sel" id="fmt"><option value="wav">WAV</option><option value="mp3">MP3 (128k)</option></select></div>
  </div>
  <div class="t-row"><button class="t-btn" id="run">Change speed</button></div>
  <p class="t-msg" id="t-msg"></p>
</div>
  <div class="t-links"><a class="t-btn" href="/convertor/63">All Convertor tools</a>
  <a class="t-btn ghost" href="/computer/62">Computer</a></div>
</main>
<script src="/audio-speed-changer/208.js" defer></script>
</body>
</html>
